<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 140" width="500" height="140">
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Left: School Emblem Shield -->
  <g transform="translate(10, 10)" filter="url(#shadow)">
    <!-- Outer Shield Frame -->
    <path d="M 60 5 C 95 5, 115 15, 115 45 C 115 85, 60 115, 60 115 C 60 115, 5 85, 5 45 C 5 15, 25 5, 60 5 Z" fill="url(#shieldGrad)" stroke="#F59E0B" stroke-width="3" />
    
    <!-- Inner Radiant Sun Rays -->
    <g transform="translate(60, 48)">
      <!-- Sun Core -->
      <circle cx="0" cy="0" r="16" fill="url(#sunGrad)" />
      <!-- Radiating Sunbeams -->
      <line x1="0" y1="-26" x2="0" y2="-19" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" />
      <line x1="18" y1="-18" x2="13" y2="-13" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" />
      <line x1="26" y1="0" x2="19" y2="0" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" />
      <line x1="18" y1="18" x2="13" y2="13" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" />
      <line x1="-18" y1="-18" x2="-13" y2="-13" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" />
      <line x1="-26" y1="0" x2="-19" y2="0" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" />
      <line x1="-18" y1="18" x2="-13" y2="13" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Crimson Martial Arts Belt / Ribbon Emblem -->
    <path d="M 30 78 Q 60 70 90 78 L 92 86 Q 60 78 28 86 Z" fill="url(#crimsonGrad)" />
    <path d="M 52 80 L 48 102 L 56 100 L 58 81 Z" fill="#DC2626" />
    <path d="M 62 81 L 64 100 L 72 102 L 68 80 Z" fill="#B91C1C" />

    <!-- 3 Stars of Excellence -->
    <polygon points="60,20 62,25 67,25 63,28 65,33 60,30 55,33 57,28 53,25 58,25" fill="#FBBF24" />
    <polygon points="40,24 41.5,28 45.5,28 42,30.5 43.5,34.5 40,32 36.5,34.5 38,30.5 34.5,28 38.5,28" fill="#F59E0B" />
    <polygon points="80,24 81.5,28 85.5,28 82,30.5 83.5,34.5 80,32 76.5,34.5 78,30.5 74.5,28 78.5,28" fill="#F59E0B" />
  </g>

  <!-- Right: School Typography & Brand Name -->
  <g transform="translate(145, 25)">
    <!-- Primary Title -->
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="900" fill="#1E293B" letter-spacing="1.5">
      SONNENLAND
    </text>

    <!-- Subtitle Category -->
    <text x="0" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="800" fill="#DC2626" letter-spacing="3">
      INTERNATIONAL SCHOOL
    </text>

    <!-- Taekwondo Program Affiliate Tag -->
    <g transform="translate(0, 72)">
      <rect x="0" y="0" width="220" height="24" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
      <text x="10" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#D97706" letter-spacing="0.5">
        🥋 OFFICIAL TAEKWONDO HUB
      </text>
    </g>
  </g>
</svg>
